<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" preserveAspectRatio="xMidYMid meet" overflow="visible">
  <defs>
    <linearGradient id="primaryGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A1FE" />
      <stop offset="30%" stop-color="#4FA9FE" />
      <stop offset="60%" stop-color="#667EEA" />
      <stop offset="100%" stop-color="#764BA2" />
    </linearGradient>

    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FA9FE" stop-opacity="0.2" />
      <stop offset="55%" stop-color="#667EEA" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="centerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="spread" />
      <feGaussianBlur in="spread" stdDeviation="2.0" result="blur" />
      <feFlood flood-color="#4FA9FE" flood-opacity="0.35" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="particleShadow" x="-200%" y="-200%" width="400%" height="400%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="spread" />
      <feGaussianBlur in="spread" stdDeviation="1.2" result="blur" />
      <feFlood flood-color="#00AEFF" flood-opacity="1" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="36" height="36" fill="#0A0E27" />

  <circle cx="18" cy="18" r="18" fill="url(#glowGradient)" />

  <circle cx="18" cy="18" r="17.75" fill="none" stroke="#4FA9FE" stroke-opacity="0.2" stroke-width="0.5" />

  <circle cx="18" cy="18" r="15.75" fill="none" stroke="#4FA9FE" stroke-opacity="0.15" stroke-width="0.5" />

  <g filter="url(#centerShadow)">
    <circle cx="18" cy="18" r="14" fill="url(#primaryGradient)" />
  </g>

  <text x="18" y="18" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="18" font-weight="700" font-family="SF Pro Text, SF Pro Display, Roboto, Arial, sans-serif">H</text>

  <g filter="url(#particleShadow)">
    <circle cx="26.25" cy="3.711" r="1.5" fill="#00AEFF" />
  </g>
</svg>
