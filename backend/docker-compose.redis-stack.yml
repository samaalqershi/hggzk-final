services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: hggzk-redis-stack
    restart: unless-stopped
    ports:
      - "6380:6379"
      - "8002:8001"
    volumes:
      - redis-stack-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes --save 60 1000"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep PONG >/dev/null && redis-cli -p 6379 MODULE LIST | grep search >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  redis-stack-data:
